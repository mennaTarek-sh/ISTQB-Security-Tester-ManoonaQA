            themeText.textContent = 'Light Mode ';
        } else {
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark Mode ';
        }
    }

    const container = document.getElementById('chaptersContainer');
    let completedChapters = JSON.parse(localStorage.getItem('completedChapters')) || [];

    function updateProgress() {
        const total = chaptersData.length;
        const completed = completedChapters.length;
        const percent = Math.round((completed / total) * 100);
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressPercent').textContent = `${percent}% (${completed} من ${total})`;
    }

    function toggleComplete(chapterId) {
        if (completedChapters.includes(chapterId)) {
            completedChapters = completedChapters.filter(id => id !== chapterId);
        } else {
            completedChapters.push(chapterId);
        }
        localStorage.setItem('completedChapters', JSON.stringify(completedChapters));
        updateProgress();
    }

    function toggleQuiz(chapterId) {
        document.getElementById(`quiz-${chapterId}`).classList.toggle('active');
    }

    function checkAnswers(chapterId) {
        const chapter = chaptersData.find(c => c.id === chapterId);
        let score = 0;

        chapter.questions.forEach((q, qIndex) => {
            const selected = document.querySelector(`input[name="q-${chapterId}-${qIndex}"]:checked`);
            const expEl = document.getElementById(`exp-${chapterId}-${qIndex}`);
            expEl.style.display = 'block';

            if (selected && parseInt(selected.value) === q.answer) {
                score++;
                expEl.style.color = 'var(--accent)';
                expEl.textContent = `✅ إجابة صحيحة! ${q.explanation}`;
            } else {
                expEl.style.color = '#ef4444';
                expEl.textContent = `❌ إجابة غير صحيحة. الصحيح: (${q.options[q.answer]}) — ${q.explanation}`;
            }
        });

        const resultEl = document.getElementById(`result-${chapterId}`);
        resultEl.style.display = 'block';
        resultEl.style.background = 'rgba(14, 165, 233, 0.15)';
        resultEl.textContent = `نتيجتك في هذا الفصل: ${score} من ${chapter.questions.length}`;
    }

    function renderChapters() {
        container.innerHTML = '';
        chaptersData.forEach(chapter => {
            const isChecked = completedChapters.includes(chapter.id) ? 'checked' : '';
            let questionsHTML = '';
            
            chapter.questions.forEach((q, qIndex) => {
                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <label class="option-label">
                            <input type="radio" name="q-${chapter.id}-${qIndex}" value="${oIndex}">
                            <span>${opt}</span>
                        </label>
                    `;
                });

                questionsHTML += `
                    <div class="question-box">
                        <div class="question-text">${q.q}</div>
                        <div class="options-list">${optionsHTML}</div>
                        <div class="explanation" id="exp-${chapter.id}-${qIndex}"></div>
                    </div>
                `;
            });

            container.innerHTML += `
                <article class="chapter-card">
                    <div class="card-header">
                        <div>
                            <span class="chapter-badge">${chapter.badge}</span>
                            <h2 class="chapter-title">${chapter.title}</h2>
                        </div>
                        <label class="complete-label">
                            <input type="checkbox" ${isChecked} onchange="toggleComplete(${chapter.id})">
                            <span>تمت المذاكرة</span>
                        </label>
                    </div>
                    <p class="chapter-summary">${chapter.summary}</p>
                    <div class="card-actions">
                        <a href="${chapter.youtubeLink}" target="_blank" class="btn btn-youtube">▶ مشاهدة الشرح على يوتيوب</a>
                        <button class="btn btn-quiz" onclick="toggleQuiz(${chapter.id})">📝 اختبر نفسك (${chapter.questions.length} أسئلة)</button>
                    </div>
                    <div class="quiz-section" id="quiz-${chapter.id}">
                        ${questionsHTML}
                        <button class="btn btn-submit-quiz" onclick="checkAnswers(${chapter.id})">تصحيح الإجابات وعرض النتيجة</button>
                        <div class="quiz-result" id="result-${chapter.id}"></div>
                    </div>
                </article>
            `;
        });
        updateProgress();
    }

    renderChapters();
</script>
